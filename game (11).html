<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>魔法門 III：Emoji 世界</title>
<style>
:root{--bg:#efe6d2;--panel:#dccfae;--ink:#2a2114;--line:#8c7a50;--accent:#b5780b;--hp:#c0392b;--mp:#2e6fd0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16120b;--panel:#241d11;--ink:#eadcb8;--line:#6b5a35;--accent:#e6b24a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16120b;--panel:#241d11;--ink:#eadcb8;--line:#6b5a35;--accent:#e6b24a}
*{box-sizing:border-box}[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{height:100%;height:100dvh;display:flex;flex-direction:column}
#view{position:relative;flex:1;min-height:0;background:#000}
#gl{width:100%;height:100%;display:block}
#info{position:absolute;left:8px;top:8px;background:#000a;color:#f3e2b0;padding:4px 9px;border-radius:8px;font-size:clamp(13px,2.2vmin,18px);line-height:1.5}
#mini{position:absolute;right:8px;top:8px;width:clamp(84px,12vmin,150px);height:clamp(84px,12vmin,150px);background:#000a;border-radius:6px;image-rendering:pixelated}
#log{position:absolute;left:10px;right:10px;bottom:6px;font-size:clamp(13px,2.2vmin,18px);color:#f6e7b8;text-shadow:0 1px 3px #000,0 0 6px #000;pointer-events:none}
#end,#menu{position:absolute;inset:0;display:grid;place-items:center;background:#000d;color:#f3e2b0;text-align:center;padding:12px}
#end h2{font-size:28px;margin:0 0 8px}
#menu>div{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;width:min(380px,100%);display:grid;gap:8px;max-height:100%;overflow:auto;text-align:left}
#menu h3{margin:0;font-size:17px}
#menu button{min-height:42px;font-size:15px;text-align:left;padding:0 12px}
button:disabled{opacity:.4}
#party{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;background:var(--panel);border-top:1px solid var(--line)}
.card{border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;display:grid;gap:3px;background:var(--bg)}
.card.act{outline:2px solid var(--accent)}.card.dead{opacity:.45}.card.empty{opacity:.3;place-items:center}
.card b{font-size:13px}.card i{display:block;height:5px;background:#0003;border-radius:3px;overflow:hidden}
.card u{display:block;height:100%}.hp{background:var(--hp)}.mp{background:var(--mp)}
#ctrl{padding:6px 6px 8px;background:var(--panel)}
#mv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#cb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{min-height:46px;font-size:18px;font-family:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
button:active:not(:disabled){background:var(--accent);color:#000}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#fight{--es:clamp(64px,min(21vw,15vh),140px);position:absolute;left:0;right:0;bottom:0;display:grid;align-items:end;grid-template-columns:repeat(4,1fr);gap:2px 6px;padding:0 6px 6px;pointer-events:none}
#fight .u{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-width:0}
#fight .e{text-align:center;font-size:var(--es);line-height:1.1;transform-origin:50% 100%;transition:transform .25s;filter:drop-shadow(0 3px 3px #000a)}
#fight .u.bk .e{font-size:calc(var(--es)*.72)}
#fight .e.act{transform:translateY(-10px) scale(1.08)}
#fight .e.dead{opacity:.5;filter:grayscale(1)}
#fight .e.atk{animation:lunge .5s}
#fight .e.hit{animation:shk .3s .25s;filter:drop-shadow(0 0 8px #f33)}
#fight .card{width:100%;padding:3px 5px;font-size:11px;gap:2px;background:var(--panel);color:var(--ink);box-shadow:0 2px 6px #0008}
#fight .card b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fight .card span{white-space:nowrap}
#app.cmb #party{display:none}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;font:900 clamp(24px,5.5vmin,40px)/1 Arial,"Noto Sans TC",sans-serif;opacity:0;white-space:nowrap;animation:popup 1.1s ease-out both}
.pop.hurt{color:#ff3b3b;text-shadow:-2px 0 #fff,2px 0 #fff,0 -2px #fff,0 2px #fff,0 4px 5px #000}
.pop.hit{color:#fff;text-shadow:-2px 0 #000,2px 0 #000,0 -2px #000,0 2px #000,0 4px 5px #000}
.pop.heal{color:#6bff72;text-shadow:-2px 0 #063,2px 0 #063,0 -2px #063,0 2px #063,0 4px 5px #000}
@keyframes popup{0%{opacity:0;transform:translate(-50%,12px) scale(.4)}12%{opacity:1;transform:translate(-50%,-4px) scale(1.6)}28%{opacity:1;transform:translate(-50%,-18px) scale(1)}70%{opacity:1;transform:translate(-50%,-52px) scale(1)}100%{opacity:0;transform:translate(-50%,-76px) scale(1)}}
@keyframes lunge{0%,100%{transform:none}35%,60%{transform:translate(var(--dx,0px),var(--dy,-120px)) scale(.45)}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fs{position:absolute;right:8px;top:calc(clamp(84px,12vmin,150px) + 16px);width:40px;min-height:40px;padding:0;font-size:18px;opacity:.85}
@media (min-aspect-ratio:6/5) and (min-width:700px){
#app{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,30vw,440px);grid-template-rows:minmax(0,1fr) auto}
#view{grid-column:1;grid-row:1/3}
#party{grid-column:2;grid-row:1;align-content:start;overflow:auto;border-top:0;border-left:1px solid var(--line)}
#ctrl{grid-column:2;grid-row:2;border-left:1px solid var(--line)}
#fight{left:50%;right:auto;width:min(100%,820px);transform:translateX(-50%)}
}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="gl"></canvas><div id="info"></div><button id="fs" aria-label="全螢幕">⛶</button><canvas id="mini" width="84" height="84"></canvas><div id="log"></div>
    <div id="fight" hidden></div><div id="fx"></div><div id="menu" hidden><div></div></div>
    <div id="end" hidden><div><h2 id="et"></h2><p id="ep"></p><button id="again" style="padding:0 22px">再玩一次</button> <button id="ld" style="padding:0 22px" hidden>📂 讀取自動存檔</button></div></div>
  </div>
  <div id="party"></div>
  <input type="file" id="imp" accept=".json,application/json" hidden>
  <div id="ctrl">
    <div id="mv">
      <button data-k="tl" aria-label="左轉">↰</button><button data-k="f" aria-label="前進">⬆️</button><button data-k="tr" aria-label="右轉">↱</button><button data-k="bag" aria-label="背包">🎒</button><button data-k="rest" aria-label="紮營">⛺</button>
      <button data-k="l" aria-label="左移">⬅️</button><button data-k="b" aria-label="後退">⬇️</button><button data-k="r" aria-label="右移">➡️</button><button data-k="tp" aria-label="回城術">🌀</button><button data-k="save" aria-label="存檔／讀檔">💾</button>
    </div>
    <div id="cb" hidden><button data-k="atk">⚔️ 攻擊</button><button data-k="sk" id="sk">🔮 技能</button><button data-k="run">🏃 逃跑</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),rm=(a,o)=>a.splice(a.indexOf(o),1);
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]],DN=['北','東','南','西'];
const NM={village:'村莊',forest:'森林迷宮',dungeon:'地城迷宮',tower:'高塔迷宮'};
const FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
let asT,pt=null,camp=[],campSp=[],campKey=null,ret=null,inv=[],dying=[],g,W,H,mons,items,npcs,vis,P,world,theme,area,party,pool,combat,gold,xp,lvl,camps,bonus,over,menu,done,AR={},logs=[];
const view=$('#view'),renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(70,1,.05,40),amb=new THREE.AmbientLight(0xffffff,.2),torch=new THREE.PointLight(0xffaa55,1.1,8);
scene.add(camera,amb);camera.add(torch);camera.position.y=.5;
const tgt={x:1,z:1,a:0};let vx=1,vz=1;camera.rotation.order='YXZ';

const TH={
 village:{w:[null,'🌲',1],f:['#5a8f3a','🟩'],bg:0x7ec0ee,fog:[8,22],amb:.95,torch:.25,pl:16,dc:[0,[]]},
 forest:{w:[null,'🌲'],f:['#2d5a2a','🟩'],bg:0x6fb5ea,fog:[3,12],amb:.8,torch:.5,pl:34,dc:[80,['🌿','🍄','🌼']]},
 dungeon:{w:['#7a6a55','🧱'],f:['#4a3a28','🟫'],c:['#1a1830','✨'],bg:0x050403,fog:[1.5,9],amb:.2,torch:1.05},
 tower:{w:['#3a3560','🟪'],f:['#1d1b33','🔹'],c:['#0a0a2a','⭐'],bg:0x07071a,fog:[1.5,10],amb:.3,torch:1.1}};
const VIL=["###########","#.........#","#.........#","#.........#","#.........#","#.........#","#.........#","#.........#","###########"];
const MT={forest:[['🐺','野狼',12,4],['🐗','野豬',16,5],['🕷️','巨蛛',20,6],['🐻','棕熊',26,8]],
 dungeon:[['🦇','吸血蝠',16,6],['🐍','毒蛇',20,7],['💀','骷髏兵',28,9],['🧟','殭屍',34,10],['👹','食人魔',46,12]],
 tower:[['👻','幽靈',26,9],['🦂','巨蠍',32,11],['🗿','石像鬼',42,13],['🧛','吸血鬼',50,15]]};
const BOSS={dungeon:['🐉','遠古巨龍',120,16],tower:['😈','塔主惡魔',110,17]},CN={forest:10,dungeon:14,tower:12},IC={forest:[6,3,1],dungeon:[9,3,2],tower:[7,3,2]};
const CH=()=>[{n:'騎士',e:'💂',hp:42,mhp:42,mp:6,mmp:6,a:[7,13],sk:'重擊',cost:0},{n:'牧師',e:'🧑‍⚕️',hp:28,mhp:28,mp:18,mmp:18,a:[3,7],sk:'治療',cost:0},
 {n:'法師',e:'🧙',hp:24,mhp:24,mp:20,mmp:20,a:[3,6],sk:'火球',cost:70},{n:'弓手',e:'🧝',hp:30,mhp:30,mp:10,mmp:10,a:[5,10],sk:'連射',cost:60},{n:'盜賊',e:'🥷',hp:28,mhp:28,mp:8,mmp:8,a:[4,9],sk:'偷襲',cost:50},{n:'武僧',e:'🦸',hp:36,mhp:36,mp:8,mmp:8,a:[6,11],sk:'連擊',cost:60},{n:'煉金師',e:'🧑‍🔬',hp:24,mhp:24,mp:16,mmp:16,a:[3,6],sk:'酸液',cost:80},{n:'詩人',e:'🧑‍🎤',hp:26,mhp:26,mp:16,mmp:16,a:[3,7],sk:'妙音',cost:70}];
const SK={重擊:[3,'m',1.9],偷襲:[3,'m',2.4],火球:[5,'f'],連射:[3,'d'],治療:[5,'h'],連擊:[3,'d'],酸液:[5,'f'],妙音:[5,'h']};

function emo(x,e,px,cx,cy){x.font=px+'px '+FONT;x.textAlign='center';x.textBaseline='middle';x.fillText(e,cx,cy)}
const tc={};
function tile(bg,e,n){const k=bg+e+n;if(!tc[k]){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');if(bg){x.fillStyle=bg;x.fillRect(0,0,128,128)}
  (n===1?[[64,64]]:[[32,32],[96,32],[32,96],[96,96]]).forEach(([a,b])=>emo(x,e,n===1?104:60,a,b+3));const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;tc[k]=t}return tc[k]}
const stex={};
function sprite(e,s){if(!stex[e]){const c=document.createElement('canvas');c.width=c.height=128;emo(c.getContext('2d'),e,100,64,70);stex[e]=new THREE.CanvasTexture(c)}
  const m=new THREE.Sprite(new THREE.SpriteMaterial({map:stex[e]}));m.scale.set(s,s,1);return m}
const wallG=new THREE.BoxGeometry(1,1,1);

function gen(n){W=H=n;g=Array.from({length:H},()=>Array(W).fill(1));const st=[[1,1]];g[1][1]=0;
  while(st.length){const [x,y]=st[st.length-1];
    const d=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5).filter(([dx,dy])=>{const a=x+dx,b=y+dy;return a>0&&b>0&&a<W-1&&b<H-1&&g[b][a]});
    if(!d.length){st.pop();continue}const [dx,dy]=d[0];g[y+dy/2][x+dx/2]=0;g[y+dy][x+dx]=0;st.push([x+dx,y+dy])}
  for(let i=0;i<n*1.4;i++){const x=r(1,W-2),y=r(1,H-2);if(x%2!==y%2)g[y][x]=0}}
function addMon(x,y,e,n,hp,atk,boss){const s=sprite(e,boss?1:.8);s.position.set(x,boss?.5:.42,y);world.add(s);mons.push({x,y,e,n,hp,mhp:hp,atk,s,boss})}
function addItem(x,y,k){const e={gold:'💎',potion:'🧪',fountain:'⛲',dungeon:'🕳️',tower:'🗼'}[k],ex=k==='dungeon'||k==='tower';
  const s=sprite(e,ex?.9:.45);s.position.set(x,ex?.45:.22,y);world.add(s);items.push({x,y,k,e,s})}
const _qx=new THREE.Quaternion(),_qz=new THREE.Quaternion(),AX=new THREE.Vector3(1,0,0),AZ=new THREE.Vector3(0,0,1);
function bend(s,pl){const f=s.userData.f,a=(f[0]-(W-1)/2)/pl,b=(f[2]-(H-1)/2)/pl,R=pl+f[1];s.position.set(R*Math.sin(a)*Math.cos(b),R*Math.cos(a)*Math.cos(b),R*Math.sin(b))}
function put(s,x,h,z){s.userData.f=[x,h,z];if(theme.pl)bend(s,theme.pl);else s.position.set(x,h,z)}
function curve(t){world.children.forEach(s=>{if(s.userData.skip)return;s.userData.f=[s.position.x,s.position.y,s.position.z];bend(s,t.pl)});
  const [n,es]=t.dc;for(let i=0;i<n;i++){const x=r(1,W-2),y=r(1,H-2);if(g[y][x])continue;const s=sprite(es[r(0,es.length-1)],.3);s.userData.f=[x+Math.random()-.5,.12,y+Math.random()-.5];bend(s,t.pl);world.add(s)}}
function placeCam(){const pl=theme.pl;if(pl){const a=(vx-(W-1)/2)/pl,b=(vz-(H-1)/2)/pl;world.quaternion.copy(_qx.setFromAxisAngle(AX,-b).multiply(_qz.setFromAxisAngle(AZ,a)));camera.position.set(0,pl+.5,0);camera.rotation.x=-.18}else{world.quaternion.identity();camera.position.set(vx,.5,vz);camera.rotation.x=0}}
function addNpc(x,y,pe,be,f,bx,by,st,ic){const o={x,y,f,fx:x,fy:y,t0:-1e4,nx:1000+Math.random()*2000,fl:1,home:[x,y],s:null,st};if(pe){const s=sprite(pe,.5);s.position.set(x,.25,y);world.add(s);o.s=s;if(ic){const i=sprite(ic,.3);i.position.set(x,.62,y);world.add(i);o.ic=i}}if(be){const b=sprite(be,1);b.position.set(bx,.45,by);world.add(b);if(bx!==x||by!==y)g[by][bx]=1}npcs.push(o)}
function build(name,sv){
  const t=TH[name];world=new THREE.Group();mons=[];items=[];npcs=[];
  if(name==='village'){g=VIL.map(s=>[...s].map(c=>+(c==='#')));H=g.length;W=g[0].length}else if(sv){g=sv.g.map(r=>r.slice());H=g.length;W=g[0].length}else{gen(name==='forest'?21:name==='dungeon'?19:15);if(name==='forest')g[1][2]=0}
  vis=sv?sv.vis.map(r=>r.slice()):Array.from({length:H},()=>Array(W).fill(name==='village'?1:0));
  const wm=new THREE.MeshLambertMaterial({map:tile(...t.w),alphaTest:t.w[0]?0:.5});
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(g[y][x]&&DIRS.some(([dx,dy])=>g[y+dy]&&g[y+dy][x+dx]===0)){if(t.w[0]){const m=new THREE.Mesh(wallG,wm);m.position.set(x,.5,y);world.add(m)}else{const s=sprite(t.w[1],1.1);s.position.set(x,.52,y);world.add(s)}}
  const plane=(k,rot,y)=>{const tx=k==='f'?null:tile(...t[k]);if(tx)tx.repeat.set(W,H);const m=new THREE.Mesh(new THREE.PlaneGeometry(W,H).rotateX(rot),new THREE.MeshLambertMaterial(tx?{map:tx}:{color:t.f[0]}));m.position.set(W/2-.5,y,H/2-.5);world.add(m)};
  if(t.pl){const gm=new THREE.SphereGeometry(t.pl,t.pl*5|0,t.pl*3|0),ps=gm.attributes.position,cl=[],bc=new THREE.Color(t.f[0]);for(let i=0;i<ps.count;i++){const k=.82+.18*Math.sin(ps.getX(i)*1.7)*Math.sin(ps.getZ(i)*1.3+ps.getY(i)*.9);cl.push(bc.r*k,bc.g*k,bc.b*k)}gm.setAttribute('color',new THREE.Float32BufferAttribute(cl,3));const sm=new THREE.Mesh(gm,new THREE.MeshLambertMaterial({vertexColors:true}));sm.userData.skip=1;world.add(sm)}else plane('f',-Math.PI/2,0);if(t.c)plane('c',Math.PI/2,1);
  if(name==='village'){[[2,2,'🧑‍💼','🏪',shop,2,1,0,'🛒'],[4,2,'🧑‍🍳','🏡',tavern,4,1,0,'🍺'],[6,2,'🧓','⛪',temple,6,1,0,'🙏'],[8,4,'🧑‍🌾','🏡',()=>say('🧑‍🌾 農夫：森林右下角通往地城，右上角通往高塔。'),8,3,0,'💬'],[2,6,'👮','🏡',()=>say('💂 衛兵：魔力不足就別走太遠，🌀 回城術能帶你回村。'),2,5,0,'💬'],[8,6,null,'⛺',campMenu,8,6],[5,7,null,'🚪',()=>{if(ret)backTo();else{go('forest','s');say('🌲 你踏進了森林迷宮。走回入口可返回村莊。')}},5,7]].forEach(([x,y,pe,be,f,bx,by,st,ic])=>{
      addNpc(x,y,pe,be,f,bx,by,st,ic)})}
  else{
  if(sv){sv.mons.forEach(m=>{addMon(m.x,m.y,m.e,m.n,m.mhp,m.atk,m.boss);mons[mons.length-1].hp=m.hp});sv.items.forEach(i=>addItem(i.x,i.y,i.k))}else{
    const cells=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(!g[y][x]&&x+y>7&&!(x===W-2&&(y===1||y===H-2)))cells.push([x,y]);
    cells.sort(()=>Math.random()-.5);const T=MT[name];
    for(let i=0;i<CN[name];i++){const [x,y]=cells.pop();addMon(x,y,...T[Math.min(T.length-1,Math.floor((x+y-2)/(W<17?6:9))+r(0,1))])}
    if(BOSS[name])addMon(W-2,H-2,...BOSS[name],true);
    IC[name].forEach((n,j)=>{for(let i=0;i<n;i++){const [x,y]=cells.pop();addItem(x,y,['gold','potion','fountain'][j])}});
    }

  const c=e.c;if(c.fire>=2)e.atk+=4;if(c.fire>=4)e.crit=.25;if(c.guard>=2)e.def+=3;if(c.guard>=4)e.regen=5;if(c.moon>=2)e.hp+=15;if(c.moon>=4)e.leech=.3;return e}
function recalc(p){const e=E(p);p.mhp=p.bmhp+e.hp;p.mmp=p.bmmp+e.mp;p.hp=Math.min(p.hp,p.mhp);p.mp=Math.min(p.mp,p.mmp)}
function mkItem(t){const s=SL[r(0,5)],k=s[0],it={sl:k,tier:t,e:s[2]};
  if(k==='rh')it.atk=2+t*3+r(0,2);else if(k==='acc'){if(r(0,1))it.hp=5+t*5;else it.mp=2+t*3}else{it.def=Math.ceil(t/2)+1+(k==='body'?Math.floor(t/2):0);if(k==='body')it.hp=t*4}
  if(t>=1&&Math.random()<.5)it.set=['fire','guard','moon'][r(0,2)];
  it.n=(it.set?SETS[it.set].n+'·':'')+TN[t]+s[3];return it}
const statTxt=it=>[it.atk&&'攻+'+it.atk,it.def&&'防+'+it.def,it.hp&&'生命+'+it.hp,it.mp&&'魔力+'+it.mp].filter(Boolean).join(' ');
const itemTxt=it=>`${TI[it.tier]}${it.e} ${it.n}（${statTxt(it)}）`;
function loot(m){const n=m.boss?2:Math.random()<.55?1:0;for(let i=0;i<n;i++){const q=r(1,100)+Math.floor(m.mhp/3)+(m.boss?40:0),t=Math.max(q<65?0:q<90?1:q<110?2:q<130?3:4,m.boss?3:0),it=mkItem(t);inv.push(it);say(`🎁 掉落 ${itemTxt(it)}`)}}
function dmg(a,d){const e=E(a);if(Math.random()<e.crit){d*=2;say('💥 暴擊！')}if(e.leech)a.hp=Math.min(a.mhp,a.hp+Math.ceil(d*e.leech));return d}
function bagMenu(){menuOpen(`🎒 隊伍裝備（背包 ${inv.length} 件）`,party.map((p,i)=>[`${p.e} ${p.n}　攻+${E(p).atk}　防+${E(p).def}`,()=>charMenu(i)]).concat([['💰 出售背包中的普通與精良裝備',()=>{const s=inv.filter(x=>x.tier<2);gold+=s.reduce((a,x)=>a+10+x.tier*15,0);inv=inv.filter(x=>x.tier>=2);ui();bagMenu()},!inv.some(x=>x.tier<2)]]))}
function charMenu(i){const p=party[i],e=E(p),st=Object.entries(e.c).filter(([k,n])=>n>=2).map(([k,n])=>`<br><small>${SETS[k].e}${SETS[k].n}×${n}：${SETS[k].t2}${n>=4?'；'+SETS[k].t4:''}</small>`).join('');
  menuOpen(`${p.e} ${p.n}　攻+${e.atk} 防+${e.def}${st}`,SL.map(s=>[`${s[2]} ${s[1]}：${p.eq[s[0]]?itemTxt(p.eq[s[0]]):'—'}`,()=>slotMenu(i,s[0])]).concat([['↩️ 返回',bagMenu]]))}
function slotMenu(i,sl){const p=party[i],cur=p.eq[sl],rows=inv.filter(x=>x.sl===sl).sort((a,b)=>b.tier-a.tier).map(x=>[itemTxt(x),()=>{rm(inv,x);if(cur)inv.push(cur);p.eq[sl]=x;recalc(p);ui();slotMenu(i,sl)}]);
  if(cur)rows.unshift(['⬇️ 卸下 '+itemTxt(cur),()=>{inv.push(cur);p.eq[sl]=null;recalc(p);ui();charMenu(i)}]);
  menuOpen(`${p.e} ${p.n}：${SL.find(s=>s[0]===sl)[1]}`,rows.concat([['↩️ 返回',()=>charMenu(i)]]))}
function cpos(i){const d=document.querySelector(`#fight [data-i="${i}"]`),v=$('#view').getBoundingClientRect();if(!d)return[v.width/2,v.height*.7];const b=d.getBoundingClientRect();return[b.left+b.width/2-v.left,b.top-v.top+b.height*.2]}
function pop(x,y,t,c,dl){const f=document.createElement('span');f.className='pop '+c;f.textContent=t;f.style.cssText=`left:${x}px;top:${y}px;animation-delay:${dl||0}ms`;$('#fx').appendChild(f);setTimeout(()=>f.remove(),(dl||0)+1300)}
function hurt(p,d,dl){const [x,y]=cpos(party.indexOf(p));pop(x,y,'-'+d,'hurt',dl)}
function fightUI(){const f=$('#fight'),n=Date.now(),rows=Math.ceil(party.length/4);let h='';
  for(let rw=rows-1;rw>=0;rw--)for(let c=0;c<4;c++){const i=rw*4+c,p=party[i];h+=p?`<div class="u${rw?' bk':''}"><div data-i="${i}" class="e ${[combat.i===i&&'act',!p.hp&&'dead',n<p.hf&&'hit',n<p.af&&'atk'].filter(Boolean).join(' ')}">${p.hp?p.e:'💀'}</div><div class="card${combat.i===i?' act':''}${p.hp?'':' dead'}"><b>${p.n}</b><i><u class="hp" style="width:${p.hp/p.mhp*100}%"></u></i><i><u class="mp" style="width:${p.mp/p.mmp*100}%"></u></i><span>❤️${p.hp}/${p.mhp} 🔷${p.mp}</span></div></div>`:'<div class="u"></div>'}
  f.innerHTML=h;const v=$('#view').getBoundingClientRect();
  f.querySelectorAll('[data-i]').forEach(d=>{const b=d.getBoundingClientRect();d.style.setProperty('--dx',(v.left+v.width/2-(b.left+b.width/2))+'px');d.style.setProperty('--dy',(v.top+v.height*.55-b.bottom)+'px')});
  $('#log').style.bottom=(f.offsetHeight+8)+'px'}
const A={f:()=>move('f'),b:()=>move('b'),l:()=>move('l'),r:()=>move('r'),tl:()=>turn(-1),tr:()=>turn(1),rest,tp:portal,save:()=>{if(over||combat||menu)return;saveMenu()},bag:()=>{if(over||combat||menu)return;bagMenu()},atk:()=>act('atk'),sk:()=>act('sk'),run:()=>act('run')};
$('#ctrl').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&A[b.dataset.k])A[b.dataset.k]()});
$('#again').onclick=newGame;$('#ld').onclick=()=>loadSlot(AUTO);
$('#imp').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;f.text().then(t=>{try{applySave(JSON.parse(t))}catch(x){say('❌ 匯入失敗：不是有效的存檔檔案。')}})};
const fsb=$('#fs'),de=document.documentElement;if(!de.requestFullscreen&&!de.webkitRequestFullscreen)fsb.hidden=true;
fsb.onclick=()=>{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(de.requestFullscreen||de.webkitRequestFullscreen).call(de)};
const KM={w:'f',arrowup:'f',s:'b',arrowdown:'b',a:'tl',arrowleft:'tl',d:'tr',arrowright:'tr',q:'l',e:'r',r:'rest',t:'tp',p:'save',i:'bag','1':'atk','2':'sk','3':'run'};
addEventListener('keydown',e=>{if(e.key==='Escape'&&menu){closeMenu();return}const k=KM[e.key.toLowerCase()];if(k){e.preventDefault();A[k]()}});

function rs(){const w=view.clientWidth,h=view.clientHeight;if(w&&h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}}
new ResizeObserver(rs).observe(view);rs();
function tick(t){requestAnimationFrame(tick);
  vx+=(tgt.x-vx)*.2;vz+=(tgt.z-vz)*.2;camera.rotation.y+=(tgt.a-camera.rotation.y)*.2;placeCam();
  if(area==='village'){syncCamp(t);syncPortal(t)}torch.intensity=theme.torch+Math.sin(t/90)*.07+Math.random()*.04;
  mons.forEach(m=>{put(m.s,m.x,(m.boss?.5:.42)+Math.sin(t/300+m.x)*.03,m.y);if(!m.at)return;const b=m.boss?1:.8,e=Date.now()-m.at;if(e<650){const p=e/650,k=p<.4?p/.4:1-(p-.4)/.6,q=b*(1+.9*k);m.s.scale.set(q,q,1);const o=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0).multiplyScalar(m.atx*k*.7*camera.aspect).add(new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1).multiplyScalar(m.aty*k*.6));m.s.position.add(o.applyQuaternion(world.quaternion.clone().invert()))}else{m.s.scale.set(b,b,1);m.at=0}});npcs.forEach(n=>{if(!n.s)return;if(!n.st&&t>n.nx&&t>n.t0+1400){n.nx=t+1500+Math.random()*3000;const [dx,dy]=DIRS[r(0,3)],x=n.x+dx,y=n.y+dy;if(!g[y][x]&&Math.abs(x-n.home[0])+Math.abs(y-n.home[1])<=2&&!(x===P.x&&y===P.y)&&!npcs.some(o=>o!==n&&o.x===x&&o.y===y)){n.fx=n.x;n.fy=n.y;n.x=x;n.y=y;n.t0=t;if(dx)n.fl=dx}}const k0=Math.min(1,(t-n.t0)/1400),k=k0*k0*(3-2*k0);put(n.s,n.fx+(n.x-n.fx)*k,.25,n.fy+(n.y-n.fy)*k);n.s.scale.x=.5;if(n.ic){const f=n.s.userData.f;put(n.ic,f[0],.62,f[2])}});for(let i=dying.length-1;i>=0;i--){const d=dying[i],p=Math.min(1,(Date.now()-d.t0)/800),q=p<.15?1+p/.15*.25:1.25*(1-Math.pow((p-.15)/.85,2)),z=d.k*q;d.s.scale.set(z,z,1);d.s.material.color.set(0xff6666);d.s.material.opacity=1-p*.6;if(p>=1){d.w.remove(d.s);dying.splice(i,1)}}renderer.render(scene,camera)}
newGame();requestAnimationFrame(tick);
{const a=lsGet(AUTO);if(a)try{const d=JSON.parse(a);if(valid(d))menuOpen(`📂 發現自動存檔<br><small>${summary(d)}<br>選「離開」將開始新遊戲</small>`,[['📂 繼續上次進度',()=>{closeMenu();loadSlot(AUTO)}]])}catch(e){}}
</script>
